# Build Kernel — Badazz-kernel for sweet
# -----------------------------------------------------------
# Läuft bei jedem Push auf main (ausser Doku-Änderungen) und
# per workflow_dispatch.
#
# Ablauf:
#   resync-miui : miui/test mit main synchen (X-ours, Push-Rechte)
#   build       : aosp + miui bauen, ZIPs als Artefakte (keine Releases)
#   release     : NUR bei workflow_dispatch — Release mit beiden ZIPs + SHA256SUMS
#
# Rechte-Modell: workflow-weit contents:read; write nur in
# resync-miui (Branch-Push) und release (Release-Erstellung).
# -----------------------------------------------------------

name: Build Kernel

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # Resync: miui/test mit main mergen (-X ours), bevor gebaut wird.
  # Eigenständiger Job, weil nur hier contents:write nötig ist.
  # [skip ci] im Merge-Commit verhindert die Trigger-Kaskade.
  # -----------------------------------------------------------
  resync-miui:
    name: Resync miui/test with main (X-ours)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout miui/test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: true
          ref: miui/test

      - name: Resync miui branch with main (X-ours)
        run: |
          git config user.name "ksu-bot"
          git config user.email "vandalsquad187@users.noreply.github.com"
          git fetch origin main --quiet
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch bereits aktuell — kein merge/push noetig"
          else
            git merge -X ours --no-edit -m "Merge origin/main into miui/test [skip ci] (X-ours auto)" origin/main || { echo "::error::Merge-Konflikt — manueller merge noetig"; exit 1; }
            # merge aktualisiert nur den Gitlink-Entry — Submodul-Checkout neu materialisieren,
            # sonst baut der miui-Leg noch den Kernel vom VORHERIGEN Run (build377-Befund)
            git submodule sync --quiet
            git submodule update --init --recursive --force
            # GITHUB_TOKEN darf .github/* nicht aendern — yml auf Branch-Stand bringen, damit der Push-Diff keine Workflow-Datei enthaelt
            git checkout HEAD~1 -- .github/workflows/ 2>/dev/null || true
            git commit --amend --no-edit --quiet 2>/dev/null || true
            git push origin HEAD:refs/heads/miui/test || echo "::warning::resync-push fehlgeschlagen — branch bleibt alt (build laeuft trotzdem mit gemergtem baum)"
          fi

  # -----------------------------------------------------------
  # Build: aosp (main) + miui (miui/test), Artefakte only.
  # Kein Release hier — Releases macht der Release-Job.
  # -----------------------------------------------------------
  build:
    name: Build sweet kernel (${{ matrix.variant }})
    needs: [resync-miui]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - variant: aosp
            ref: main
          - variant: miui
            ref: miui/test
      fail-fast: false
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # -------------------------------------------------------
      # Schritt 1: Repo auschecken
      # -------------------------------------------------------
      - name: Checkout source (${{ matrix.variant }})
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ matrix.ref }}

      # -------------------------------------------------------
      # Schritt 2: Cross-Compiler + Build-Tools installieren
      # Toolchain auf ubuntu-24.04 gepinnt; gcc-Version landet in
      # build-info.txt, damit Builds reproduzierbar dokumentiert sind.
      # -------------------------------------------------------
      - name: Install toolchain
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            ccache \
            clang \
            llvm
          aarch64-linux-gnu-gcc --version | head -1

      # -------------------------------------------------------
      # Schritt 3: ccache-Cache wiederherstellen
      # Key ist pro Run eindeutig (schreibt neuen Cache),
      # restore-keys holt den jüngsten Stand. So friert der
      # Cache nicht mehr auf dem ersten Key ein.
      # -------------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-sweet-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-sweet-${{ matrix.variant }}-

      # -------------------------------------------------------
      # Schritt 4: Kernel-Version aus Makefile extrahieren
      # -------------------------------------------------------
      - name: Extract kernel version
        id: kernel_ver
        run: |
          VERSION=$(grep "^VERSION = " Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          SUBLEVEL=$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
          echo "full=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT
          echo "short=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT

      - name: Extract KSU version
        id: ksu_ver
        run: |
          KSU_VER=$(grep "KSU_VERSION=" KernelSU-Next/kernel/Makefile | head -1 | sed 's/.*KSU_VERSION=//')
          echo "version=$KSU_VER" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # Schritt 5: Kernel + Device Trees konfigurieren
      # -------------------------------------------------------
      - name: Configure kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          if [ "${{ matrix.variant }}" = "miui" ]; then
            scripts/kconfig/merge_config.sh arch/arm64/configs/sweet_defconfig arch/arm64/configs/sweet_miui.config
            cp .config arch/arm64/configs/tmp_miui_defconfig
            make tmp_miui_defconfig
          else
            make sweet_defconfig
          fi
          # Build-Nummer in Kernel-Version einbetten (Identifikation per uname/dmesg)
          sed -E -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-BadazzKernel-sweet-v1.3.2-build${{ github.run_number }}-${{ matrix.variant }}"/' .config
          grep -E "^CONFIG_LOCALVERSION=" .config
          grep -qF 'build${{ github.run_number }}-${{ matrix.variant }}' .config || { echo "::error::LOCALVERSION patch failed"; exit 1; }
          sed -i 's/CONFIG_LLVM_POLLY=y/# CONFIG_LLVM_POLLY is not set/' .config
          grep -q 'CONFIG_CC_STACKPROTECTOR_STRONG=y' .config || \
            echo 'CONFIG_CC_STACKPROTECTOR_STRONG=y' >> .config
          make olddefconfig

      # -------------------------------------------------------
      # Schritt 6: Kritische Kernel-Configs validieren
      # Verhindert fehlerhafte Builds durch fehlende Optionen.
      # -------------------------------------------------------
      - name: Validate kernel config
        run: |
          echo "=== USB/PHY config dump ==="
          grep -E "^CONFIG_(PHY_QCOM_QUSB2|USB_DWC3|USB_DWC3_MSM|MSM_QUSB_PHY|USB_MSM_SSPHY_QMP|GENERIC_PHY|OF|ARCH_QCOM|NVMEM)=" .config || true
          echo "=== end dump ==="
          REQUIRED_CONFIGS=(
            "CONFIG_KSU=y"
            "CONFIG_KSU_SUSFS=y"
            "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
            "CONFIG_K6A_GOV=m"
            "CONFIG_NFC_NQ_PN80T=y"
            "CONFIG_PHY_QCOM_QUSB2=y"
          )
          errors=0
          for config in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -q "^${config}$" .config; then
              echo "::error::Missing required config: ${config}"
              errors=$((errors+1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAILED: $errors required config(s) missing"
            exit 1
          fi
          echo "::notice::All required kernel configs are enabled"

      # -------------------------------------------------------
      # Schritt 7: Kernel + DTBs bauen
      # ccache über PATH aktiviert (USE_CCACHE ist eine
      # AOSP-Variable, die Kbuild nicht kennt).
      # -------------------------------------------------------
      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          export PATH=/usr/lib/ccache:$PATH
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=true
          export CCACHE_MAXSIZE=2G
          JOBS=$(nproc)
          MEM_GB=$(grep MemTotal /proc/meminfo | awk '{printf "%.0f", $2/1024/1024}')
          if [ "$MEM_GB" -lt 8 ]; then
            JOBS=2
          fi
          make -j$JOBS Image.gz dtb.img dtbo.img
          make -j$JOBS modules
          ccache -s | tee -a "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------
      # Schritt 7b: Post-Build Config verifizieren + QUSB2-Objekt prüfen
      # + k6a_gov.ko prüfen (Version per modinfo, nicht per grep auf der Binärdatei)
      # -------------------------------------------------------
      - name: Verify post-build config
        run: |
          echo "=== post-build .config QUSB2 ==="
          grep -E "QUSB2" .config || echo "QUSB2 MISSING FROM POST-BUILD .config!"
          echo "=== QUSB2 object check ==="
          ls -la drivers/phy/qualcomm/phy-qcom-qusb2.o 2>&1 || echo "phy-qcom-qusb2.o NOT BUILT!"
          if ! grep -q "^CONFIG_PHY_QCOM_QUSB2=y$" .config; then
            echo "::error::QUSB2 dropped during build! Post-build .config lacks it."
            exit 1
          fi
          if [ ! -f drivers/phy/qualcomm/phy-qcom-qusb2.o ]; then
            echo "::error::QUSB2 object not compiled!"
            exit 1
          fi
          echo "::notice::QUSB2 verified in post-build config and objects"
          echo "=== k6a_gov.ko check ==="
          if ! grep -q "^CONFIG_K6A_GOV=m$" .config; then
            echo "::error::CONFIG_K6A_GOV is not =m in post-build .config"
            exit 1
          fi
          if [ ! -f drivers/thermal/k6a_gov/k6a_gov.ko ]; then
            echo "::error::drivers/thermal/k6a_gov/k6a_gov.ko was not built"
            exit 1
          fi
          ls -la drivers/thermal/k6a_gov/k6a_gov.ko
          echo "=== vermagic check (k6a_gov.ko vs kernel.release) ==="
          VM=$(modinfo -F vermagic drivers/thermal/k6a_gov/k6a_gov.ko)
          KR=$(cat include/config/kernel.release)
          echo "vermagic: $VM"
          echo "release : $KR"
          case "$VM" in
            "$KR "*) echo "::notice::vermagic matches kernel.release ($KR)" ;;
            *) echo "::error::vermagic mismatch — k6a_gov.ko would NOT load on device"; exit 1 ;;
          esac
          echo "::notice::k6a_gov.ko verified"

      # -------------------------------------------------------
      # Schritt 8: AnyKernel3-flashbares ZIP + Metadaten erstellen
      # -------------------------------------------------------
      - name: Build flashable ZIP
        run: |
          VERSION="${{ steps.kernel_ver.outputs.short }}"
          KSU_VER="${{ steps.ksu_ver.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          SUFFIX="-${VARIANT}"

          cp arch/arm64/boot/Image.gz anykernel/
          cp arch/arm64/boot/dtb.img anykernel/
          cp arch/arm64/boot/dtbo.img anykernel/
          cp drivers/thermal/k6a_gov/k6a_gov.ko anykernel/

          K6A_GOV_VERSION=$(modinfo -F version drivers/thermal/k6a_gov/k6a_gov.ko 2>/dev/null || true)
          [ -n "$K6A_GOV_VERSION" ] || K6A_GOV_VERSION=unknown
          TOOLCHAIN=$(aarch64-linux-gnu-gcc --version | head -1)

          # Build-Info für Debugging und User-Transparenz
          cat > anykernel/build-info.txt << EOF
          KERNEL_VERSION=${VERSION}
          KSU_VERSION=${KSU_VER}
          K6A_GOV_VERSION=${K6A_GOV_VERSION}
          VARIANT=${{ matrix.variant }}
          TOOLCHAIN=${TOOLCHAIN}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_SHA=${{ github.sha }}
          EOF

          cd anykernel
          zip -r9 ../Badazz-kernel-sweet-v${VERSION}-build${{ github.run_number }}${SUFFIX}.zip * \
            -x ".git/*" "README.md"

      # -------------------------------------------------------
      # Schritt 8b: ZIP als Artifact hochladen
      # -------------------------------------------------------
      - name: Upload flashable ZIP (fuer Release-Job)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Badazz-kernel-sweet-v${{ steps.kernel_ver.outputs.short }}-build${{ github.run_number }}${{ matrix.variant }}
          path: Badazz-kernel-sweet-*.zip


      # -------------------------------------------------------
      # Schritt 10: Zusammenfassung
      # -------------------------------------------------------
      - name: Show summary
        run: |
          VERSION="${{ steps.kernel_ver.outputs.short }}"
          KSU_VER="${{ steps.ksu_ver.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          echo "=== Build abgeschlossen ($VARIANT) ==="
          echo "Kernel: Badazz-kernel v${VERSION}-badazz-build${{ github.run_number }}-$VARIANT"
          echo "KSU:    v${KSU_VER} (UAPIv2)"
          echo "ZIP:    Badazz-kernel-sweet-v${VERSION}-build${{ github.run_number }}-$VARIANT.zip"

  # -----------------------------------------------------------
  # Release: NUR bei workflow_dispatch (oder Tag-Push). Ein Push
  # auf main baut nur Artefakte — Doku-Fixes erzeugen keine
  # Releases mehr mit evtl. falscher ZIP (Build399-Befund).
  # Enthält beide zips (aosp + miui) + SHA256SUMS.
  # -----------------------------------------------------------
  release:
    name: Release (aosp + miui + SHA256SUMS)
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout (fuer Versionsauszug)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 12

      - name: Versionsauszug
        id: ver
        run: |
          VERSION=$(grep "^VERSION = " Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          SUBLEVEL=$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
          echo "short=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT

      - name: Download artifacts (aosp + miui)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: SHA256-Prüfsummen
        run: |
          cd dist
          sha256sum Badazz-kernel-sweet-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release-Body vorbereiten
        run: |
          {
            echo "**Badazz-kernel** für sweet (sweetin / sweet_k6a)"
            echo
            echo "- **Basis:** ${{ steps.ver.outputs.short }}-openela-rc1-perf"
            echo "- **Root:** KernelSU-Next (UAPIv2)"
            echo "- **Manager:** KernelSU-Next Manager APK installieren"
            echo "- **2 Builds pro Release:** \`-aosp.zip\` (Stock/HOS/LOS) und \`-miui.zip\` (MIUI: stock-USB-Profil)"
            echo "- **Integrität:** \`SHA256SUMS\` im Release — vor dem Flashen prüfen"
            echo
            echo "**Changelog:**"
            git log --oneline HEAD~10..HEAD 2>/dev/null | grep -v 'skip ci' | head -10
            echo
            echo "**Flashbar via OrangeFox / TWRP** — einfach das passende ZIP flashen."
          } > body.md

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.short }}-badazz-build${{ github.run_number }}
          name: "Badazz-kernel v${{ steps.ver.outputs.short }}-badazz-build${{ github.run_number }}"
          body_path: body.md
          files: |
            dist/Badazz-kernel-sweet-*.zip
            dist/SHA256SUMS
