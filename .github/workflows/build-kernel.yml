# Build Kernel — Badazz-kernel for sweet
# -----------------------------------------------------------
# Läuft bei jedem Push auf Branch main
# Baut den Kernel + DTBs, packt ein flashbares AnyKernel3-ZIP
# und veröffentlicht es als GitHub Release.
#
# Ablauf:
#   1. Repo clonen
#   2. AArch64 Cross-Compiler installieren
#   3. ccache-Cache wiederherstellen (persistent über Runs)
#   4. Kernel + DTBs bauen (sweet_defconfig)
#   5. Kritische Configs validieren
#   6. Artefakte in anykernel/ kopieren
#   7. Flashbares ZIP + Build-Info erstellen
#   8. Release erstellen mit ZIP als Artefakt
#   9. ccache-Cache speichern
# -----------------------------------------------------------

name: Build Kernel

on:
  push:
    branches: [main, 23.2, ksu-next-fix-100]
  workflow_dispatch:

jobs:
  build:
    name: Build sweet kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # -------------------------------------------------------
      # Schritt 1: Repo auschecken
      # -------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # -------------------------------------------------------
      # Schritt 2: Cross-Compiler + Build-Tools installieren
      # Der Kernel 4.14 baut sauber mit dem distro-eigenen
      # aarch64-linux-gnu-gcc (GCC 13/14).
      # ccache für inkrementelle Builds, clang für LTO-Unterstützung.
      # -------------------------------------------------------
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            ccache \
            clang \
            llvm

      # -------------------------------------------------------
      # Schritt 3: ccache-Cache wiederherstellen
      # Persistiert über GitHub Actions Cache — Key basiert auf
      # Kernel-Makefile, um bei Versionswechseln zu invalidieren.
      # -------------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-sweet-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-sweet-

      # -------------------------------------------------------
      # Schritt 4: Kernel-Version aus Makefile extrahieren
      # -------------------------------------------------------
      - name: Extract kernel version
        id: kernel_ver
        run: |
          VERSION=$(grep "^VERSION = " Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          SUBLEVEL=$(grep "^SUBLEVEL = " Makefile | awk '{print $3}')
          echo "full=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT
          echo "short=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_OUTPUT

      - name: Extract KSU version
        id: ksu_ver
        run: |
          KSU_VER=$(grep "KSU_VERSION=" KernelSU-Next/kernel/Makefile | head -1 | sed 's/.*KSU_VERSION=//')
          echo "version=$KSU_VER" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # Schritt 5: Kernel + Device Trees konfigurieren
      # -------------------------------------------------------
      - name: Configure kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          make sweet_defconfig
          sed -i 's/CONFIG_LLVM_POLLY=y/# CONFIG_LLVM_POLLY is not set/' .config
          grep -q 'CONFIG_CC_STACKPROTECTOR_STRONG=y' .config || \
            echo 'CONFIG_CC_STACKPROTECTOR_STRONG=y' >> .config
          make olddefconfig

      # -------------------------------------------------------
      # Schritt 6: Kritische Kernel-Configs validieren
      # Verhindert fehlerhafte Builds durch fehlende Optionen.
      # -------------------------------------------------------
      - name: Validate kernel config
        run: |
          echo "=== USB/PHY config dump ==="
          grep -E "^CONFIG_(PHY_QCOM_QUSB2|USB_DWC3|USB_DWC3_MSM|MSM_QUSB_PHY|USB_MSM_SSPHY_QMP|GENERIC_PHY|OF|ARCH_QCOM|NVMEM)=" .config || true
          echo "=== end dump ==="
          REQUIRED_CONFIGS=(
            "CONFIG_KSU=y"
            "CONFIG_KSU_SUSFS=y"
            "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
            "CONFIG_K6A_GOV=y"
            "CONFIG_NFC_NQ_PN80T=y"
            "CONFIG_PHY_QCOM_QUSB2=y"
          )
          errors=0
          for config in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -q "^${config}$" .config; then
              echo "::error::Missing required config: ${config}"
              errors=$((errors+1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAILED: $errors required config(s) missing"
            exit 1
          fi
          echo "::notice::All required kernel configs are enabled"

      # -------------------------------------------------------
      # Schritt 7: Kernel + DTBs bauen
      # ccache mit Kompression und Größenlimit für schnelle
      # inkrementelle Builds und minimierten Speicherverbrauch.
      # -------------------------------------------------------
      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          export CCACHE_COMPRESS=true
          export CCACHE_MAXSIZE=2G
          JOBS=$(nproc)
          MEM_GB=$(grep MemTotal /proc/meminfo | awk '{printf "%.0f", $2/1024/1024}')
          if [ "$MEM_GB" -lt 8 ]; then
            JOBS=2
          fi
          make -j$JOBS Image.gz dtb.img dtbo.img

      # -------------------------------------------------------
      # Schritt 8: AnyKernel3-flashbares ZIP + Metadaten erstellen
      # -------------------------------------------------------
      - name: Build flashable ZIP
        run: |
          VERSION="${{ steps.kernel_ver.outputs.short }}"
          KSU_VER="${{ steps.ksu_ver.outputs.version }}"

          cp arch/arm64/boot/Image.gz anykernel/
          cp arch/arm64/boot/dtb.img anykernel/
          cp arch/arm64/boot/dtbo.img anykernel/

          # Build-Info für Debugging und User-Transparenz
          cat > anykernel/build-info.txt << EOF
          KERNEL_VERSION=${VERSION}
          KSU_VERSION=${KSU_VER}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_SHA=${{ github.sha }}
          EOF

          cd anykernel
          zip -r9 ../Badazz-kernel-sweet-v${VERSION}.zip * \
            -x ".git/*" "README.md"

      # -------------------------------------------------------
      # Schritt 8b: ZIP als Artifact hochladen (Test-Branches)
      # -------------------------------------------------------
      - name: Upload flashable ZIP
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Badazz-kernel-sweet-v${{ steps.kernel_ver.outputs.short }}-build${{ github.run_number }}
          path: Badazz-kernel-sweet-*.zip

      # -------------------------------------------------------
      # Schritt 9: Release erstellen
      # Tag-Name und Release-Name basieren auf Kernel-Version
      # für eine saubere Versionskette.
      # -------------------------------------------------------
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.kernel_ver.outputs.short }}-badazz-build${{ github.run_number }}
          name: "Badazz-kernel v${{ steps.kernel_ver.outputs.short }}"
          body: |
            **Badazz-kernel** für sweet (sweetin / sweet_k6a)

            - **Basis:** ${{ steps.kernel_ver.outputs.full }}-openela-rc1-perf
            - **Root:** KernelSU-Next (KSU_VERSION=${{ steps.ksu_ver.outputs.version }}, UAPIv2)
            - **Manager:** KernelSU-Next Manager APK installieren

            **Changelog:**
            $(git log --oneline HEAD~10..HEAD 2>/dev/null || git log --oneline -10)

            **Flashbar via OrangeFox / TWRP** — einfach das ZIP flashen.
          files: Badazz-kernel-sweet-*.zip

      # -------------------------------------------------------
      # Schritt 10: Zusammenfassung
      # -------------------------------------------------------
      - name: Show summary
        run: |
          VERSION="${{ steps.kernel_ver.outputs.short }}"
          KSU_VER="${{ steps.ksu_ver.outputs.version }}"
          echo "=== Build abgeschlossen ==="
          echo "Kernel: Badazz-kernel v${VERSION}"
          echo "KSU:    v${KSU_VER} (UAPIv2)"
          echo "ZIP:    Badazz-kernel-sweet-v${VERSION}.zip"
