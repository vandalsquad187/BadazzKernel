name: Lockdep Test Build

on:
  workflow_dispatch:
    inputs:
      kasan:
        description: 'Add CONFIG_KASAN=y (slow, GCC 13 on 4.14 may fail — that is the test)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'drivers/thermal/**'
      - 'drivers/gpu/msm/**'
      - 'kernel/locking/**'

concurrency:
  group: lockdep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockdep:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libncurses-dev libssl-dev lzop

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-lockdep-${{ github.run_id }}
          restore-keys: ccache-lockdep-

      - name: Build with PROVE_LOCKING + DEBUG_ATOMIC_SLEEP
        run: |
          export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
          export PATH=/usr/lib/ccache:$PATH
          printf 'CONFIG_DEBUG_KERNEL=y\nCONFIG_PROVE_LOCKING=y\nCONFIG_DEBUG_ATOMIC_SLEEP=y\nCONFIG_FORTIFY_SOURCE=y\nCONFIG_DEBUG_OBJECTS_WORK=y\nCONFIG_DEBUG_LIST=y\n# CONFIG_LOCKDEP_CROSSRELEASE is not set\n# CONFIG_LOCKDEP_COMPLETIONS is not set\n' > lockdep.config
          if [ "${{ inputs.kasan }}" = "true" ]; then
            echo 'CONFIG_KASAN=y' >> lockdep.config
          fi
          scripts/kconfig/merge_config.sh -m arch/arm64/configs/sweet_defconfig lockdep.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- olddefconfig
          grep -E "CONFIG_(PROVE_LOCKING|DEBUG_ATOMIC_SLEEP|FORTIFY_SOURCE|DEBUG_OBJECTS_WORK|DEBUG_LIST)=" .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- -j$(nproc) Image.gz
          ls -la arch/arm64/boot/Image.gz

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lockdep-image
          path: arch/arm64/boot/Image.gz
